<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typst Local</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="editor-page loading">
  <header class="topbar">
    <button id="toggle-sidebar" class="icon-btn" title="Toggle file panel">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></svg>
    </button>
    <a href="/" class="logo" title="All projects"><span class="logo-mark">t</span></a>
    <span class="crumb-sep">/</span>
    <button id="project-name" class="project-name" title="Rename project">…</button>
    <div class="spacer"></div>
    <span id="conn" class="conn connecting" title="connecting"></span>
    <div id="avatars" class="avatars"></div>
    <button id="mobile-toggle" class="btn">Preview</button>
    <button id="share-btn" class="btn">Share</button>
    <button id="download-btn" class="btn primary">Download ▾</button>
  </header>
  <main class="workspace">
    <aside id="sidebar" class="sidebar">
      <div class="pane-head sidebar-tabs">
        <button id="tab-files" class="tab active">Files</button>
        <button id="tab-history" class="tab">History</button>
        <button id="tab-headings" class="tab">Headings</button>
      </div>
      <div class="files-toolbar files-only">
        <span class="files-toolbar-label">Project files</span>
        <div class="pane-actions">
          <button id="new-file-btn" class="icon-btn" title="New file">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H4v12h8V5z"/><path d="M8 7.5v4M6 9.5h4"/></svg>
          </button>
          <button id="new-folder-btn" class="icon-btn" title="New folder">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h4.5l1.5 1.5h6v7H2z"/><path d="M8 7.8v3.4M6.3 9.5h3.4"/></svg>
          </button>
          <button id="upload-btn" class="icon-btn" title="Upload files or a folder">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M4.5 6.5L8 3l3.5 3.5M3 13h10"/></svg>
          </button>
          <button id="unused-images-btn" class="icon-btn" title="Delete unused images">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13H2.5V3h10v5"/><path d="M2.5 10.5l3-3 3 3"/><circle cx="9.5" cy="6" r="1"/><path d="M11 12.5h4"/></svg>
          </button>
        </div>
      </div>
      <div id="tree" class="tree files-only"></div>
      <div class="headings-panel headings-only">
        <div class="headings-tools">
          <input id="headings-filter" class="text-input" type="search" placeholder="Filter" autocomplete="off" spellcheck="false">
          <div id="headings-depth" class="depth-picker" title="How many heading levels to show"></div>
        </div>
        <div id="headings-list" class="headings-list"></div>
      </div>
      <div class="history-panel history-only">
        <div class="git-bar">
          <span class="git-branch" title="Every version is a commit on this branch">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="4.5" cy="3.5" r="1.6"/><circle cx="4.5" cy="12.5" r="1.6"/><circle cx="11.5" cy="5.5" r="1.6"/><path d="M4.5 5.1v5.8M11.5 7.1c0 2.5-3 2.2-6.2 4.1"/></svg>
            main
          </span>
          <div class="spacer"></div>
          <button id="git-clone-btn" class="btn small" title="Clone the history with git" hidden>Clone</button>
          <button id="save-version-btn" class="btn small primary">Commit…</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
      <div class="drop-hint">Drop files or folders to upload</div>
      <input type="file" id="upload-input" multiple hidden>
      <input type="file" id="upload-folder-input" webkitdirectory multiple hidden>
    </aside>
    <section class="editor-pane">
      <div class="pane-head">
        <span id="file-title" class="pane-title mono"></span>
        <span id="diff-legend" class="diff-legend" hidden><span class="lg-del">in this version</span><span class="lg-ins">added since</span></span>
      </div>
      <div id="editor" class="editor"></div>
      <div id="problems" class="problems"></div>
    </section>
    <div id="splitter" class="splitter"></div>
    <section class="preview-pane">
      <div class="pane-head">
        <div id="preview-target" class="preview-target" hidden>
          <button id="target-main" type="button"></button>
          <button id="target-file" type="button"></button>
        </div>
        <span id="compile-status" class="status busy">Connecting…</span>
        <div class="spacer"></div>
        <button id="preview-back" class="btn small" title="Back to where you were before following a link" hidden>← Back</button>
        <span id="page-info" class="muted page-info"></span>
        <button id="follow-btn" class="btn small active">Follow</button>
        <div class="zoom">
          <button id="zoom-out" class="icon-btn" title="Zoom out">−</button>
          <span id="zoom-label" class="zoom-label">100%</span>
          <button id="zoom-in" class="icon-btn" title="Zoom in">+</button>
          <button id="zoom-fit" class="btn small active" title="Fit width">Fit</button>
        </div>
      </div>
      <div id="preview" class="preview"></div>
      <div class="version-banner">
        <span class="version-banner-label">Viewing version</span>
        <span id="version-banner-text" class="version-banner-text"></span>
        <div class="spacer"></div>
        <button id="version-exit" class="btn small">Back to current</button>
      </div>
      <div id="version-preview" class="preview version-preview">
        <div id="version-preview-status" class="version-preview-status" hidden></div>
        <div id="version-pages" class="version-pages"></div>
      </div>
    </section>
  </main>
  <div class="loading-screen"><div class="spinner"></div></div>
  <script type="module" src="/editor.js"></script>
</body>
</html>
